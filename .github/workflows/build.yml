name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build from zip
        run: |
          unzip -q -o "$(ls *.zip | head -1)" -d unpacked
          DIR=$(dirname "$(find unpacked -maxdepth 4 -name gradlew | head -1)")
          cd "$DIR"
          chmod +x gradlew
          ./gradlew build
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/libs/*.jar "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: mod
          path: out/*.jar
